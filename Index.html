<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HTML Example</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #111827;
      color: white;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    h1 {
      color: #a78bfa;
      margin-bottom: 16px;
    }
    button {
      background: #8b5cf6;
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #7c3aed;
    }
  </style>
</head>
<body>
  <h1>HTML is running</h1>
  <p>This is a normal HTML file</p>
  <button onclick="alert('It works!')">Click me</button>
</body>
</html>
